name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest -q

      - name: Check for trailing whitespace
        run: |
          if git grep -InE ' +$' -- '*.py' '*.md' '*.toml' '*.cfg' '*.yml' '*.yaml'; then
            echo "Trailing whitespace found in the lines above."
            exit 1
          fi
