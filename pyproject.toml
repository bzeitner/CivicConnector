[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civicconnector"
version = "0.1.0"
description = "Reusable connectors for Legistar/Granicus, CivicClerk, and Municode, normalized into one canonical Meeting/AgendaItem/Vote/Document schema."
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["civicconnector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
